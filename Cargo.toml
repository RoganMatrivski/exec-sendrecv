[package]
name = "exec-sendrecv"
version = "0.4.0"
authors = ["Robin Mauritz <robinmauritzrm@gmail.com>"]
# this was 2021 due to my template project pls don't witch hunt me i'm not using ai for this-
edition = "2024"
repository = "https://github.com/RoganMatrivski/exec-sendrecv"
license = "MIT OR Apache-2.0"
description = "i'unno"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "^0.1.48"


[dependencies]
clap = { version = "^4.5", features = ["derive"] }
color-eyre = { version = "0.6.3", features = ["capture-spantrace"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
indicatif = "0.18.4"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sysinfo = "0.38.4"
supports-color = "3.0.2"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
patchsync = { git = "https://github.com/RoganMatrivski/patchsync", version = "0.1.0" }
iroh = "1.0.3"
iroh-tickets = "1.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
flume = "0.12.0"
directories = "6.0.0"
command-group = "5.0.1"
is_executable = "1.0.6"
ignore = "0.4.33"

[target.'cfg(not(windows))'.dependencies]
libc = "*"

[dev-dependencies]
tempfile = "3"


[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
publish = false
tag = true
push = true
